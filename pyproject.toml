[project]
name = "safetydial"
version = "0.1.0"
description = "SafetyDial: targeted experience for reliable safety predictions in LeWM"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=1.26",
    "torch>=2.2",
    "gymnasium>=0.29",
    "wandb>=0.16",
    "tqdm>=4.66",
    "huggingface_hub>=0.24",
    "h5py>=3.11",
    "zstandard>=0.22",
    "hdf5plugin>=7.0.0",
    "stable-worldmodel[env,train]>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "ipykernel>=6.29",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["experiments", "scripts"]

[tool.ruff.lint.per-file-ignores]
# Notebook-facing helpers are consumed via `from helpers.X import *`.
"experiments/helpers/*.py" = ["F403", "F405"]
# Imports follow sys.path setup, and star-imported names resolve at runtime.
"experiments/scripts/*.py" = ["E402", "F403", "F405"]
# Research notebooks: exploratory idioms (star imports, imports after code,
# cell-level redefinition) are deliberate. Real errors still surface.
"experiments/*.ipynb" = ["E402", "E702", "E741", "F401", "F403", "F405", "F541", "F811"]
