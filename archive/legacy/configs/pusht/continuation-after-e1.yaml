# Future managed continuation; current continuation.yaml remains immutable while running.
version: 1
workflow_id: pusht-continuation-after-e1-20260926-2
working_directory: .
state_dir: runs/workflows/pusht-continuation-after-e1-20260926-2
poll_interval_seconds: 15
wait_timeout_seconds: 172800
stages:
  - id: development_feasible_routes
    wait_for:
      - docs/mainPlan/results/continuation-v2/decomposition/decomposition.json
      - data/study/pusht/continuation-v2/e1/dev/manifest.json
      - data/study/pusht/continuation-v2/e1/test/manifest.json
      - data/study/pusht/continuation-v2/e1/stress/manifest.json
    requires_gates:
      - path: docs/mainPlan/results/continuation-v2/decomposition/decomposition.json
        key: gate.passes
    argv:
      - uv
      - run
      - python
      - experiments/scripts/pusht_development_witness.py
      - --banks-dir
      - data/study/pusht/continuation-v2/e1
      - --output-dir
      - docs/mainPlan/results/continuation-v2/development-witness
      - --run-id
      - pusht-development-witness-continuation-20260926-2
    timeout_seconds: 21600
    fresh_outputs:
      - docs/mainPlan/results/continuation-v2/development-witness
    outputs:
      - docs/mainPlan/results/continuation-v2/development-witness
    gate:
      path: docs/mainPlan/results/continuation-v2/development-witness/witnesses.json
      key: gate.passes
      stop_exit_codes: [0, 2]

  - id: repairability_and_retention_gate
    requires_gates:
      - path: docs/mainPlan/results/continuation-v2/decomposition/decomposition.json
        key: gate.passes
      - path: docs/mainPlan/results/continuation-v2/development-witness/witnesses.json
        key: gate.passes
    argv:
      - uv
      - run
      - python
      - experiments/scripts/pusht_e2_repair.py
      - --run-id
      - pusht-adapt-e2-continuation-20260926-2
      - --banks-dir
      - data/study/pusht/continuation-v2/e1
      - --probes-run
      - runs/pusht-probes-continuation-20260926-2
      - --feasibility-report
      - docs/mainPlan/results/continuation-v2/development-witness/witnesses.json
      - --decomposition-report
      - docs/mainPlan/results/continuation-v2/decomposition/decomposition.json
      - --study-dir
      - data/study/pusht/continuation-v2/e2
      - --results-dir
      - docs/mainPlan/results/continuation-v2/repair
      - --retention-episodes
      - '20'
      - --retention-blocks
      - '50'
    timeout_seconds: 172800
    fresh_outputs:
      - data/study/pusht/continuation-v2/e2
      - docs/mainPlan/results/continuation-v2/repair
      - runs/pusht-adapt-e2-continuation-20260926-2
    outputs:
      - data/study/pusht/continuation-v2/e2
      - docs/mainPlan/results/continuation-v2/repair
      - runs/pusht-adapt-e2-continuation-20260926-2
    gate:
      path: docs/mainPlan/results/continuation-v2/repair/repair.json
      key: gate.passes
      stop_exit_codes: [0, 2]
