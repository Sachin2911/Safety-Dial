# Separate qualified continuation; leave all active configurations unchanged.
# E3 uses 128 common seed branches plus cumulative additions 64/128/256/512.
# E4 and exact-case retention are reported even if E3 cannot unlock E5.
# E5 selects boundary/seed0 independently of retention outcomes; no replacement seed is searched.
# This workflow uploads only normal experiment result/checkpoint bundles, never source backups.
version: 1
workflow_id: pusht-continuation-after-e2-20260926-2
working_directory: .
state_dir: runs/workflows/pusht-continuation-after-e2-20260926-2
poll_interval_seconds: 15
wait_timeout_seconds: 172800
stages:
- id: paired_acquisition
  argv:
  - uv
  - run
  - python
  - experiments/scripts/pusht_e3_acquisition.py
  - --run-id
  - pusht-acq-continuation-20260926-2
  - --e2-report
  - docs/mainPlan/results/continuation-v2/repair/repair.json
  - --feasibility-report
  - docs/mainPlan/results/continuation-v2/development-witness/witnesses.json
  - --banks-dir
  - data/study/pusht/continuation-v2/e1
  - --assets-run
  - runs/pusht-assets-20260926-1
  - --probes-run
  - runs/pusht-probes-continuation-20260926-2
  - --output-dir
  - docs/mainPlan/results/continuation-v2/acquisition
  - --data-dir
  - data/study/pusht/continuation-v2/e3
  - --checkpoint-dir
  - runs/pusht-acq-continuation-20260926-2
  - --seeds
  - '0'
  - '1'
  - '2'
  - --arms
  - random
  - boundary
  - --budgets
  - '64'
  - '128'
  - '256'
  - '512'
  - --acq-roots
  - '96'
  - --pool-per-root
  - '40'
  timeout_seconds: 172800
  fresh_outputs:
  - docs/mainPlan/results/continuation-v2/acquisition
  - data/study/pusht/continuation-v2/e3
  - runs/pusht-acq-continuation-20260926-2
  outputs:
  - docs/mainPlan/results/continuation-v2/acquisition
  - data/study/pusht/continuation-v2/e3
  - runs/pusht-acq-continuation-20260926-2
  wait_for:
  - docs/mainPlan/results/continuation-v2/repair/repair.json
  - docs/mainPlan/results/continuation-v2/repair/repair_rows.npz
  - docs/mainPlan/results/continuation-v2/repair/goal_retention_cases.json
  - docs/mainPlan/results/continuation-v2/development-witness/witnesses.json
  - runs/pusht-adapt-e2-continuation-20260926-2/hf_upload.json
  watch_gates:
  - path: docs/mainPlan/results/continuation-v2/decomposition/decomposition.json
    key: gate.passes
  - path: docs/mainPlan/results/continuation-v2/development-witness/witnesses.json
    key: gate.passes
  - path: docs/mainPlan/results/continuation-v2/repair/repair.json
    key: gate.passes
  requires_gates:
  - path: docs/mainPlan/results/continuation-v2/repair/repair.json
    key: gate.passes
  - path: docs/mainPlan/results/continuation-v2/development-witness/witnesses.json
    key: gate.passes
- id: final_checkpoint_goal_retention
  argv:
  - uv
  - run
  - python
  - experiments/scripts/pusht_transfer_retention.py
  - --acquisition-report
  - docs/mainPlan/results/continuation-v2/acquisition/acquisition.json
  - --cases
  - docs/mainPlan/results/continuation-v2/repair/goal_retention_cases.json
  - --checkpoint-root
  - runs/pusht-acq-continuation-20260926-2
  - --output-dir
  - docs/mainPlan/results/continuation-v2/transfer-retention
  - --run-id
  - pusht-transfer-retention-continuation-20260926-2
  timeout_seconds: 86400
  fresh_outputs:
  - docs/mainPlan/results/continuation-v2/transfer-retention
  outputs:
  - docs/mainPlan/results/continuation-v2/transfer-retention
- id: geometric_transfer_report
  argv:
  - uv
  - run
  - python
  - experiments/scripts/pusht_e4_report.py
  - --acquisition-report
  - docs/mainPlan/results/continuation-v2/acquisition/acquisition.json
  - --retention-report
  - docs/mainPlan/results/continuation-v2/transfer-retention/transfer_retention.json
  - --output-dir
  - docs/mainPlan/results/continuation-v2/transfer-e4
  timeout_seconds: 3600
  fresh_outputs:
  - docs/mainPlan/results/continuation-v2/transfer-e4
  outputs:
  - docs/mainPlan/results/continuation-v2/transfer-e4
- id: closedloop_selection_gate
  argv:
  - uv
  - run
  - python
  - experiments/scripts/pusht_e5_selection.py
  - resolve
  - --acquisition-report
  - docs/mainPlan/results/continuation-v2/acquisition/acquisition.json
  - --e2-report
  - docs/mainPlan/results/continuation-v2/repair/repair.json
  - --feasibility-report
  - docs/mainPlan/results/continuation-v2/development-witness/witnesses.json
  - --retention-report
  - docs/mainPlan/results/continuation-v2/transfer-retention/transfer_retention.json
  - --cases
  - docs/mainPlan/results/continuation-v2/repair/goal_retention_cases.json
  - --banks-dir
  - data/study/pusht/continuation-v2/e1
  - --checkpoint-root
  - runs/pusht-acq-continuation-20260926-2
  - --e5-run-id
  - pusht-closedloop-continuation-20260926-2
  - --e5-output-dir
  - docs/mainPlan/results/continuation-v2/closedloop
  - --out
  - docs/mainPlan/results/continuation-v2/e5-selection.json
  - --acquisition-seed
  - '0'
  - --blocks
  - '10'
  - --samples
  - '300'
  - --iterations
  - '30'
  - --case-seed
  - '20261005'
  - --lam
  - '0.05'
  timeout_seconds: 1800
  fresh_outputs:
  - docs/mainPlan/results/continuation-v2/e5-selection.json
  outputs:
  - docs/mainPlan/results/continuation-v2/e5-selection.json
  gate:
    path: docs/mainPlan/results/continuation-v2/e5-selection.json
    key: gate.passes
    stop_exit_codes:
    - 0
    - 2
- id: conditional_paired_closedloop
  argv:
  - uv
  - run
  - python
  - experiments/scripts/pusht_e5_selection.py
  - run
  - --selection
  - docs/mainPlan/results/continuation-v2/e5-selection.json
  timeout_seconds: 21600
  fresh_outputs:
  - docs/mainPlan/results/continuation-v2/closedloop
  outputs:
  - docs/mainPlan/results/continuation-v2/closedloop
  requires_gates:
  - path: docs/mainPlan/results/continuation-v2/e5-selection.json
    key: gate.passes
