# Fresh v3 recovery. No v2 config, run, bank or result is adopted or modified.
# Reuse only the completed physical probes and released assets identified below.
# Development freezes 8 candidate slots per source and at most 1 accepted root/source.
# Preserve the full study: 24 dev roots; test and stress each retain 64 roots per family.
# No final bank is created until development-only feasible-route evidence passes.
# Phase hashes deliberately exclude the shared e1 parent: final appends test/stress
# without mutating the already-hashed dev bank, sampling plan or source snapshot.
# All uploads are normal experiment bundles; source_snapshot is local provenance only.
# E4 is reported even if E3 cannot unlock E5. E5 keeps predeclared boundary/seed0.
version: 1
workflow_id: pusht-continuation-20260926-3
working_directory: .
state_dir: runs/workflows/pusht-continuation-20260926-3
poll_interval_seconds: 15
wait_timeout_seconds: 172800
stages:
- id: development_bank_and_frozen_plan
  wait_for:
  - runs/pusht-assets-20260926-1/scalers.npz
  - runs/pusht-assets-20260926-1/splits.json
  - runs/pusht-assets-20260926-1/hf_revision.txt
  - runs/pusht-probes-continuation-20260926-2/block_pose_mlp.pt
  - runs/pusht-probes-continuation-20260926-2/manifest.json
  - runs/pusht-probes-continuation-20260926-2/hf_upload.json
  argv:
  - uv
  - run
  - python
  - experiments/scripts/pusht_e1_banks.py
  - --phase
  - development
  - --run-id
  - pusht-banks-development-continuation-20260926-3
  - --output-dir
  - data/study/pusht/continuation-v3/e1
  - --results-dir
  - docs/mainPlan/results/continuation-v3/banks-development
  - --dev-roots
  - '24'
  - --dev-tapes
  - '8'
  - --test-roots
  - '64'
  - --test-tapes
  - '16'
  - --seed
  - '20260927'
  - --exclude-bank
  - data/study/pusht/e0
  timeout_seconds: 172800
  fresh_outputs:
  - data/study/pusht/continuation-v3/e1
  - docs/mainPlan/results/continuation-v3/banks-development
  outputs:
  - data/study/pusht/continuation-v3/e1/dev
