# Separate retrospective reference after the normal study and transfer report.
# Same frozen root cache, candidate pools, seeds and budgets; full pool is charged.
# A censored pool yields an explicit undefined-ceiling stop with all outcomes saved.
version: 1
workflow_id: pusht-oracle-continuation-20260926-3
working_directory: .
state_dir: runs/workflows/pusht-oracle-continuation-20260926-3
poll_interval_seconds: 15
wait_timeout_seconds: 604800
stages:
- id: retrospective_oracle_reference
  wait_for:
  - docs/mainPlan/results/continuation-v3/acquisition/manifest.json
  - docs/mainPlan/results/continuation-v3/transfer-e4/transfer.json
  - data/study/pusht/continuation-v3/e3/acq_roots/hf_upload.json
  watch_gates:
  - path: docs/mainPlan/results/continuation-v3/decomposition/decomposition.json
    key: gate.passes
  - path: docs/mainPlan/results/continuation-v3/development-witness/witnesses.json
    key: gate.passes
  - path: docs/mainPlan/results/continuation-v3/repair/repair.json
    key: gate.passes
  requires_gates:
  - path: docs/mainPlan/results/continuation-v3/repair/repair.json
    key: gate.passes
  - path: docs/mainPlan/results/continuation-v3/development-witness/witnesses.json
    key: gate.passes
  argv:
  - uv
  - run
  - python
  - experiments/scripts/pusht_e3_acquisition.py
  - --run-id
  - pusht-oracle-continuation-20260926-3
  - --e2-report
  - docs/mainPlan/results/continuation-v3/repair/repair.json
  - --feasibility-report
  - docs/mainPlan/results/continuation-v3/development-witness/witnesses.json
  - --banks-dir
  - data/study/pusht/continuation-v3/e1
  - --assets-run
  - runs/pusht-assets-20260926-1
  - --probes-run
  - runs/pusht-probes-continuation-20260926-2
  - --output-dir
  - docs/mainPlan/results/continuation-v3/oracle-reference
  - --data-dir
  - data/study/pusht/continuation-v3/oracle
  - --checkpoint-dir
  - runs/pusht-oracle-continuation-20260926-3
  - --seeds
  - '0'
  - '1'
  - '2'
  - --arms
  - oracle
  - --budgets
  - '64'
  - '128'
  - '256'
  - '512'
  - --acq-roots
  - '96'
  - --pool-per-root
  - '40'
  - --reference-report
  - docs/mainPlan/results/continuation-v3/acquisition/acquisition.json
  - --acq-roots-dir
  - data/study/pusht/continuation-v3/e3/acq_roots
  timeout_seconds: 172800
  fresh_outputs: &id001
  - docs/mainPlan/results/continuation-v3/oracle-reference
  - data/study/pusht/continuation-v3/oracle
  - runs/pusht-oracle-continuation-20260926-3
  outputs: *id001
  gate:
    path: docs/mainPlan/results/continuation-v3/oracle-reference/oracle_gate.json
    key: gate.passes
    stop_exit_codes:
    - 0
    - 2
