- id: conditional_paired_closedloop
  argv:
  - uv
  - run
  - python
  - experiments/scripts/pusht_e5_selection.py
  - run
  - --selection
  - docs/mainPlan/results/continuation-v4/e5-selection.json
  timeout_seconds: 21600
  fresh_outputs:
