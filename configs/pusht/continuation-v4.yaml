- id: closedloop_selection_gate
  argv:
  - uv
  - run
  - python
  - experiments/scripts/pusht_e5_selection.py
  - resolve
  - --acquisition-report
  - docs/mainPlan/results/continuation-v4/acquisition/acquisition.json
  - --e2-report
  - docs/mainPlan/results/continuation-v4/repair/repair.json
  - --feasibility-report
  - docs/mainPlan/results/continuation-v4/development-witness/witnesses.json
  - --retention-report
  - docs/mainPlan/results/continuation-v4/transfer-retention/transfer_retention.json
  - --cases
  - docs/mainPlan/results/continuation-v4/repair/goal_retention_cases.json
  - --banks-dir
  - data/study/pusht/continuation-v4/e1
  - --checkpoint-root
  - runs/pusht-acq-continuation-20260926-4
  - --e5-run-id
  - pusht-closedloop-continuation-20260926-4
